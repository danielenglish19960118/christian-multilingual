<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sponsor Partnership | Faith Paradise</title>
  <style>
    :root { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #38bdf8; --border: #334155; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; min-height: 100vh; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 960px; width: 100%; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 32px; }
    .back-btn { color: var(--accent); text-decoration: none; font-weight: 600; display: inline-block; margin-bottom: 20px; }
    .form-control { width: 100%; background-color: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: #fff; margin-top: 4px; margin-bottom: 12px; }
    .btn-submit { background: var(--accent); color: #0f172a; border: none; padding: 12px 24px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-btn">← Back to Portal Home</a>
    <h1>Sponsor & Organization Partnership</h1>
    <form action="https://formspree.io/f/myeezkkw" method="POST">
      <label>Organization / Name</label>
      <input type="text" name="name" class="form-control" required placeholder="Organization title">
      <label>Email Address</label>
      <input type="email" name="email" class="form-control" required placeholder="danielenglish19960118@gmail.com">
      <label>Partnership Proposal</label>
      <textarea name="message" class="form-control" style="min-height:100px;" required placeholder="Share your proposal..."></textarea>
      <button type="submit" class="btn-submit">Send Proposal</button>
    </form>
  </div>
</body>
</html>
