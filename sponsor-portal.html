<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sponsor Partnership | Christian Multilingual Faith Paradise</title>
  <style>
    :root { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #38bdf8; --border: #334155; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.8; min-height: 100vh; padding: 24px; display: flex; justify-content: center; }
    .container { max-width: 980px; width: 100%; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
    .back-btn { color: var(--accent); text-decoration: none; font-weight: 600; display: inline-block; margin-bottom: 24px; }
    h1 { font-size: 2.2rem; margin-bottom: 20px; color: var(--text-main); border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; text-align: left; margin-bottom: 16px; }
    .form-group label { font-size: 0.95rem; color: var(--text-main); font-weight: 500; }
    .form-control { background-color: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: var(--text-main); font-size: 1rem; outline: none; width: 100%; }
    .form-control:focus { border-color: var(--accent); }
    .btn-submit { background: var(--accent); color: #0f172a; border: none; padding: 14px 24px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1rem; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-btn">← Back to Portal Home</a>
    <h1>Sponsor & Partner Inquiry Portal</h1>
    
    <p style="color:var(--text-muted); margin-bottom:20px;">We welcome Christian sponsors, academic institutions, and senior mentors to partner with us. Submissions are processed securely via Formspree endpoint.</p>
    
    <form action="https://formspree.io/f/myeezkkw" method="POST">
      <div class="form-group"><label>Inquiry Category</label>
        <select name="sender_type" class="form-control">
          <option value="Sponsor / Organization">Sponsor / Partner Organization</option>
          <option value="Senior Mentor / Scholar">Senior Mentor / Academic Scholar</option>
          <option value="Other Partnership">Other Collaboration / Proposal</option>
        </select>
      </div>
      <div class="form-group"><label>Your Name / Title</label><input type="text" name="name" class="form-control" required placeholder="Name or Organization Title"></div>
      <div class="form-group"><label>Email Address</label><input type="email" name="email" class="form-control" required placeholder="danielenglish19960118@gmail.com"></div>
      <div class="form-group"><label>Proposal / Guidance Message</label><textarea name="message" class="form-control" style="min-height:140px;" required placeholder="Share your message or partnership proposal..."></textarea></div>
      <button type="submit" class="btn-submit">Submit Inquiry</button>
    </form>
  </div>
</body>
</html>
