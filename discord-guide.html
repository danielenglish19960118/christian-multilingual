<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Guide | Faith Paradise</title>
  <style>
    :root { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #38bdf8; --discord-purple: #5865F2; --border: #334155; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; min-height: 100vh; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 960px; width: 100%; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 32px; }
    .back-btn { color: var(--accent); text-decoration: none; font-weight: 600; display: inline-block; margin-bottom: 20px; }
    .card { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border); padding: 20px; border-radius: 8px; margin-top: 16px; }
    .card h3 { color: var(--accent); margin-bottom: 6px; }
    .card p { color: var(--text-muted); font-size: 0.95rem; }
    .btn-discord { display: inline-block; background-color: var(--discord-purple); color: #fff; text-decoration: none; font-weight: 700; padding: 12px 24px; border-radius: 8px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-btn">← Back to Portal Home</a>
    <h1>Discord Server Guide</h1>
    <div class="card">
      <h3>Channel Onboarding</h3>
      <p>Select your native and learning language roles in #welcome to unlock specialized study wings and prayer channels.</p>
    </div>
    <a href="https://discord.gg/AcsQ6DDqPB" target="_blank" class="btn-discord">Join Discord Server</a>
  </div>
</body>
</html>
