<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Search Engine Verification Tags -->
  <meta name="google-site-verification" content="81Aicyu58UFfFMLW-RMThNT_kYLKN4a_8huPibh3yCM" />
  <meta name="yandex-verification" content="95222f99001d1e09" />

  <title>Christian Multilingual Faith Paradise | Mass Repository Portal</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --discord-purple: #5865F2;
      --youtube-red: #FF0000;
      --whatsapp-green: #25D366;
      --border: #334155;
      --gold: #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.8; min-height: 100vh; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 1080px; width: 100%; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 36px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }

    /* 導覽列 */
    nav { border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 32px; }
    .nav-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .logo { font-size: 1.4rem; font-weight: 700; color: var(--accent); text-decoration: none; display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .logo svg { width: 26px; height: 26px; fill: var(--accent); }

    .nav-links { display: flex; gap: 6px; list-style: none; flex-wrap: wrap; }
    .nav-item { position: relative; }
    .nav-item > a { color: var(--text-muted); text-decoration: none; font-size: 0.88rem; font-weight: 500; padding: 6px 10px; border-radius: 6px; display: flex; align-items: center; gap: 4px; transition: all 0.2s; cursor: pointer; }
    .nav-item:hover > a { color: var(--accent); background: rgba(56, 189, 248, 0.1); }

    .dropdown-menu { display: none; position: absolute; top: 100%; left: 0; background-color: var(--card-bg); min-width: 230px; box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.6); border: 1px solid var(--border); border-radius: 8px; z-index: 100; padding: 6px 0; margin-top: 4px; }
    .dropdown-menu a { color: var(--text-muted); padding: 9px 16px; text-decoration: none; display: block; font-size: 0.85rem; cursor: pointer; }
    .dropdown-menu a:hover { background-color: rgba(56, 189, 248, 0.15); color: var(--accent); }
    .nav-item:hover .dropdown-menu { display: block; }

    /* 搜尋與篩選列 */
    .search-box { display: flex; gap: 12px; margin-bottom: 24px; }
    .search-input { flex: 1; background: #0f172a; border: 1px solid var(--border); padding: 12px 16px; border-radius: 8px; color: var(--text-main); font-size: 0.95rem; outline: none; }
    .search-input:focus { border-color: var(--accent); }
    .search-btn { background: var(--accent); color: #0f172a; border: none; padding: 0 20px; font-weight: bold; border-radius: 8px; cursor: pointer; }

    /* 文章與卡片清單 */
    .blog-list-item { background: rgba(15, 23, 42, 0.65); border: 1px solid var(--border); padding: 20px; border-radius: 12px; margin-bottom: 16px; cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
    .blog-list-item:hover { border-color: var(--accent); transform: translateY(-2px); }
    .blog-list-item h3 { color: var(--gold); font-size: 1.15rem; margin-bottom: 6px; }
    .blog-list-meta { font-size: 0.82rem; color: var(--accent); margin-bottom: 10px; font-weight: 500; }
    .blog-list-desc { color: var(--text-muted); font-size: 0.92rem; }

    /* 分頁控制器 */
    .pagination { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--border); }
    .page-btn { background: #0f172a; border: 1px solid var(--border); color: var(--text-main); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
    .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .page-info { color: var(--text-muted); font-size: 0.9rem; }

    /* 單篇文章閱讀器 */
    .article-view { background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border); border-left: 4px solid var(--gold); padding: 32px; border-radius: 12px; }
    .article-view h2 { color: var(--gold); font-size: 1.8rem; margin-bottom: 12px; }
    .article-meta { color: var(--accent); font-size: 0.88rem; font-weight: 600; margin-bottom: 20px; }
    .article-body { color: var(--text-muted); font-size: 1rem; line-height: 1.8; }
    .article-body p { margin-bottom: 16px; }

    .back-btn { display: inline-block; color: var(--accent); text-decoration: none; font-weight: 600; margin-bottom: 20px; cursor: pointer; font-size: 0.92rem; }
    .footer { border-top: 1px solid var(--border); margin-top: 40px; padding-top: 24px; text-align: center; color: var(--text-muted); font-size: 0.88rem; }
  </style>
</head>
<body>

  <div class="container">
    <nav>
      <div class="nav-top">
        <a onclick="showHome()" class="logo">
          <svg viewBox="0 0 24 24"><path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/></svg>
          Faith Paradise Repository
        </a>
      </div>
      <ul class="nav-links">
        <li class="nav-item"><a onclick="showHome()">Home</a></li>
        <li class="nav-item"><a onclick="renderBlogList(1)">Blog Library (萬篇庫)</a></li>
        <li class="nav-item"><a href="https://discord.gg/AcsQ6DDqPB" target="_blank">Discord 24/7</a></li>
        <li class="nav-item"><a href="https://chat.whatsapp.com/CiwJ88eSR19BPLwrDpsYMN?s=cl&p=a&mlu=4&ilr=4" target="_blank">WhatsApp Group</a></li>
      </ul>
    </nav>

    <!-- 搜尋與動態渲染容器 -->
    <div id="app-content"></div>

    <div class="footer">
      <p>&copy; 2026 Christian Multilingual Faith Paradise | Scalable Architecture Edition</p>
    </div>
  </div>

  <script>
    // 建立萬篇級別的資料結構陣列（此處以動態生成 10,000 筆資料庫為例，生產環境可透過 JSON 異步載入）
    const totalPostsCount = 10000;
    const postsPerPage = 10;
    let currentPage = 1;
    let filteredPosts = [];

    // 核心資料庫初始化（示範前幾篇精細內容，其餘由巨量索引自動擴充）
    const initialPosts = [
      {
        id: 1,
        title: "The Utility of Scots Cognates and Germanic Roots in English Etymological Pedagogy",
        author: "Yang Cheng-han (楊承翰)",
        date: "2026-10-24",
        category: "Linguistics & Pedagogy",
        summary: "Exploring comparative lexicography and early Scots cognates to accelerate English vocabulary acquisition and historical Bible reading.",
        content: "<p>For autodidactic language learners and educators, unlocking English vocabulary through its historical Germanic roots—particularly through early Scots cognates—provides an intuitive architectural framework for retention and comparative analysis.</p><p>Scots, sharing a direct Old Northumbrian ancestor with Northern Middle English, preserves rich phonological and lexical features that clarify archaic and formal English terminology found in historical Bible translations such as the King James Bible and Tyndale's manuscripts.</p>"
      },
      {
        id: 2,
        title: "Unpacking Hesed (חֶסֶד): Covenantal Faithfulness Across Translations",
        author: "Research Wing",
        date: "2026-10-18",
        category: "Old Testament Exegesis",
        summary: "A deep exegesis of the Hebrew root Hesed, mapping its occurrences across the Old Testament and Greek Septuagint.",
        content: "<p>In Hebrew lexicography, few words capture the depth of God's covenant relationship with humanity as intensely as Hesed (חֶסֶד - Strong's H2617). Often translated as 'lovingkindness', 'steadfast love', or 'mercy', Hesed represents an unbreakable, committed affection based on covenantal promise rather than transient emotion.</p>"
      }
    ];

    // 動態擴充至 10,000 筆測試結構文章，確保網頁效能秒開
    for (let i = 3; i <= totalPostsCount; i++) {
      initialPosts.push({
        id: i,
        title: `Etymological Study & Biblical Lexicon Entry #${i}: Root Structural Analysis`,
        author: "Faith Paradise Academic Repository",
        date: "2026-10-24",
        category: i % 2 === 0 ? "Hebrew Lexicon" : "Greek Manuscripts",
        summary: `Automated archival entry #${i} covering etymological roots, morphological breakdown, and parallel translation cross-referencing.`,
        content: `<p>This is dynamic repository entry #${i}. It contains morphological breakdown, Strong's concordance mapping, and contextual analysis for biblical word studies across Hebrew, Greek, and English versions.</p>`
      });
    }

    filteredPosts = [...initialPosts];

    function showHome() {
      const app = document.getElementById('app-content');
      app.innerHTML = `
        <div style="text-align:center; padding:40px 20px; background:linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(30, 41, 59, 0.8)); border:1px solid var(--border); border-radius:12px; margin-bottom:32px;">
          <h1 style="font-size:2.2rem; margin-bottom:12px;">Multilingual Faith & Lexicon Paradise</h1>
          <p style="color:var(--text-muted); max-width:700px; margin:0 auto;">Housing over 10,000+ structured etymological entries, comparative scripture studies, and daily world intercession logs.</p>
          <button onclick="renderBlogList(1)" style="margin-top:20px; background:var(--accent); color:#0f172a; border:none; padding:12px 24px; font-weight:bold; border-radius:8px; cursor:pointer; font-size:1rem;">Browse 10,000+ Articles ↗</button>
        </div>
      `;
    }

    function renderBlogList(page = 1) {
      currentPage = page;
      const app = document.getElementById('app-content');
      
      const startIdx = (currentPage - 1) * postsPerPage;
      const endIdx = startIdx + postsPerPage;
      const pagePosts = filteredPosts.slice(startIdx, endIdx);
      const totalPages = Math.ceil(filteredPosts.length / postsPerPage);

      let html = `
        <div class="search-box">
          <input type="text" id="searchInput" class="search-input" placeholder="Search across 10,000+ articles (e.g. Hesed, Scots, Entry #500)..." onkeyup="handleSearch()">
        </div>
        <div style="margin-bottom:16px; color:var(--text-muted); font-size:0.9rem;">
          Showing ${startIdx + 1} - ${Math.min(endIdx, filteredPosts.length)} of ${filteredPosts.length} total entries
        </div>
      `;

      pagePosts.forEach(post => {
        html += `
          <div class="blog-list-item" onclick="viewArticle(${post.id})">
            <h3>${post.title}</h3>
            <div class="blog-list-meta">By ${post.author} • ${post.date} • ${post.category}</div>
            <div class="blog-list-desc">${post.summary}</div>
          </div>
        `;
      });

      // 分頁按鈕渲染
      html += `
        <div class="pagination">
          <button class="page-btn" onclick="renderBlogList(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>← Previous</button>
          <span class="page-info">Page ${currentPage} of ${totalPages}</span>
          <button class="page-btn" onclick="renderBlogList(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Next →</button>
        </div>
      `;

      app.innerHTML = html;
      window.scrollTo(0, 0);
    }

    function handleSearch() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      filteredPosts = initialPosts.filter(post => 
        post.title.toLowerCase().includes(query) || 
        post.summary.toLowerCase().includes(query) ||
        post.category.toLowerCase().includes(query)
      );
      renderBlogList(1);
    }

    function viewArticle(id) {
      const post = initialPosts.find(p => p.id === id);
      if (!post) return;

      const app = document.getElementById('app-content');
      app.innerHTML = `
        <a onclick="renderBlogList(${currentPage})" class="back-btn">← Back to Article Index</a>
        <div class="article-view">
          <h2>${post.title}</h2>
          <div class="article-meta">Author: ${post.author} | Date: ${post.date} | Category: ${post.category}</div>
          <div class="article-body">
            ${post.content}
          </div>
        </div>
      `;
      window.scrollTo(0, 0);
    }

    document.addEventListener('DOMContentLoaded', showHome);
  </script>

</body>
</html>
