<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community | Christian Multilingual</title>
  <style>
    :root { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #38bdf8; --discord-purple: #5865F2; --youtube-red: #FF0000; --border: #334155; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; min-height: 100vh; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 960px; width: 100%; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 32px; }
    nav { border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 30px; }
    .logo { font-size: 1.3rem; font-weight: 700; color: var(--accent); text-decoration: none; margin-bottom: 16px; display: block; }
    .nav-links { display: flex; gap: 12px; list-style: none; flex-wrap: wrap; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; padding: 6px 12px; border-radius: 6px; }
    .nav-links a.active { color: var(--accent); background: rgba(56, 189, 248, 0.1); }
    .btn-group { display: flex; flex-direction: column; gap: 16px; align-items: center; margin-top: 32px; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 360px; padding: 14px 24px; border-radius: 10px; text-decoration: none; font-weight: 700; color: #fff; }
    .btn-youtube { background-color: var(--youtube-red); }
    .btn-discord { background-color: var(--discord-purple); }
    .btn-outline { background-color: transparent; border: 1px solid var(--border); color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <a href="index.html" class="logo">Faith Paradise</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="resources.html">Bible Resources</a></li>
        <li><a href="languages.html">Languages</a></li>
        <li><a href="etymology.html">Etymology</a></li>
        <li><a href="mentors.html">Mentors & Sponsors</a></li>
        <li><a href="schedule.html">Schedule</a></li>
        <li><a href="faq.html">FAQ</a></li>
        <li><a href="community.html" class="active">Community</a></li>
      </ul>
    </nav>
    <h1 style="text-align: center;">Join Our Community</h1>
    <p style="color: var(--text-muted); text-align: center; margin-top: 8px;">Connect on Discord or subscribe to our YouTube channel for updates.</p>
    <div class="btn-group">
      <a href="https://www.youtube.com/@ChristianMultilingual" target="_blank" class="btn btn-youtube">
        Watch on YouTube
      </a>
      <a href="https://discord.gg/AcsQ6DDqPB" target="_blank" class="btn btn-discord">
        Join Discord Server
      </a>
      <a href="https://discord.com/register" target="_blank" class="btn btn-outline">
        Register on Discord
      </a>
    </div>
  </div>
</body>
</html>
